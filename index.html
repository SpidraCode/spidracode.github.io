<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SpidraCode</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: white;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #020617;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #38bdf8;
      margin: 0;
    }

    section {
      padding: 20px;
    }

    .servicios {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    .card {
      background-color: #1e293b;
      padding: 15px;
      border-radius: 10px;
      width: 200px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 10px;
      background-color: #020617;
    }

    button {
      background-color: #38bdf8;
      border: none;
      padding: 10px 15px;
      color: black;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
}

    button:hover {
      background-color: #0ea5e9;
}
  </style>
</head>

<body>

  <header>
    <h1>SpidraCode</h1>
    <p>Soluciones en desarrollo web, apps y datos</p>
  </header>

  <section>
    <h2>Servicios</h2>
    <div class="servicios">
      <div class="card">🌐 Desarrollo Web</div>
      <div class="card">📱 Aplicaciones</div>
      <div class="card">📊 Análisis de Datos</div>
    </div>
  </section>

  <section>
    <h2>Contacto</h2>
    <p>¿Tenés un proyecto? Completá el formulario:</p>
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSfiuxkyto6sTDmz4gSz7J4gXdv45Tx7p9O-gZlmvjS8YsNnzw/viewform?usp=header" target="_blank">
    <button>Enviar proyecto</button>
  </a>
  </section>

  <footer>
    <p>© 2026 SpidraCode</p>
  </footer>

</body>
</html>
